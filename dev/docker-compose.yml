# Local test stack for the Ticket Automation plugin.
#
#   ./dev/up.sh       build, install osTicket, seed test data
#   ./dev/test.sh     unit tests + integration suite against this stack
#   ./dev/down.sh     stop and delete everything
#
# Ports bind to 127.0.0.1 only.
name: spta-dev

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: osticket
      MARIADB_USER: osticket
      MARIADB_PASSWORD: ${SPTA_DB_PASSWORD:?run dev/up.sh}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
    tmpfs:
      - /var/lib/mysql

  mail:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:${SPTA_MAIL_PORT:-8029}:8025"

  osticket:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SPTA_HTTP_PORT:-8091}:80"
    volumes:
      - ..:/var/www/html/include/plugins/ticket-automation:ro
      - ./seed:/seed:ro
      - ../tests:/tests:ro
