name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC: catches PHP release drift and base image changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check all PHP files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find . -name '*.php' -print0)
          exit $fail

      - name: Unit tests
        run: php tests/unit.php

  integration:
    name: Integration (osTicket 1.18.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start test stack
        run: ./dev/up.sh

      - name: Unit and integration suites
        run: ./dev/test.sh

      - name: Stop test stack
        if: always()
        run: ./dev/down.sh

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        uses: studio-prisma/github-config-security-workflow/.github/actions/actionlint@780e3012406a3997f465b04dad9fc52a3a82e5bd # v1.2.1

  # Zentraler Security-Scan: gitleaks, TruffleHog, Trivy, Semgrep (alle blockierend).
  # Semgrep blockiert nur neue Funde. Version: Commit des Release-Tags, siehe Kommentar.
  security:
    uses: studio-prisma/github-config-security-workflow/.github/workflows/security.yml@780e3012406a3997f465b04dad9fc52a3a82e5bd # v1.2.1
    with:
      semgrep-rules: "p/php p/security-audit"
    secrets:
      identity-pattern: ${{ secrets.IDENTITY_PATTERN }}

  # Single aggregating context for the branch ruleset: required-status-check
  # names are job names, and the lint matrix produces one per PHP version.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [lint, integration, security, actionlint]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "actionlint=${{ needs.actionlint.result }}"
          exit 1
