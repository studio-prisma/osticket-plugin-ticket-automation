name: Feature request
description: Suggest a capability this plugin does not have yet
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What should happen automatically that no rule can express today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: |
        Rules change tickets through osTicket's own methods. They do not send mail to
        customers, delete anything, or call external services.
      options:
        - label: My request stays within that scope
          required: true
