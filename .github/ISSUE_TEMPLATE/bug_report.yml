name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** paste ticket contents, customer names or e-mail addresses
        into this form. Redact hostnames if they are not public.

        If a rule changes a ticket it should not, or anyone but an admin can make it run, this is a
        security issue: report it privately via the security link, not here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ticket in status ..., event ...
        2. Rule settings (screenshot of the instance or the values)
        3. ...
    validations:
      required: true

  - type: input
    id: osticket-version
    attributes:
      label: osTicket version
      placeholder: "1.18.4"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3.33"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Customer or collaborator message trigger
        - Agent reply or note trigger
        - Due-date trigger (cron)
        - Actions or internal note
        - Plugin configuration
        - Loop or rule ran twice
        - Other or unclear
    validations:
      required: true

  - type: input
    id: server
    attributes:
      label: Web server
      placeholder: "Apache 2.4 or Nginx 1.26"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: PHP error log and Admin Panel, Dashboard, System Logs (title "Ticket Automation"). Redact IPs and names.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the rule in dry-run mode or read its system-log entries
          required: true
        - label: I have removed all customer data from this report
          required: true
